name: Application reminders

# Daily; the script decides who is due (every 3 days after signing up).
on:
  schedule:
    - cron: "0 17 * * *" # 10am Pacific (PDT) / 9am (PST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log who would be emailed without sending"
        type: boolean
        default: true

jobs:
  remind:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HackRx/scripts/reminders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node send-application-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
